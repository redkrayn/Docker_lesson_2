version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    env_file: .env.prod

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: always
    user: "1000:1000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles 
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8000:8000" 
    depends_on:
      - db

volumes:
  postgres_data_prod:
  media_prod:
  static_prod:
